# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest

name: Build and Release Executable

on:
  push:
    tags:
      - 'v*' # Triggers the workflow when you push a tag starting with 'v'

permissions:
  contents: write # Allows the workflow to create a GitHub Release

jobs:
  build:
    strategy:
      matrix:
        # Pick the operating systems you want to build your app on
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # STEP FOR YOUR LANGUAGE: Replace this block with your language setup
      # Examples: actions/setup-python, actions/setup-node, actions/setup-go
      # -------------------------------------------------------------
      - name: Set up Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Compile step (Example using Python + PyInstaller)
      - name: Install Compiler/Packager
        run: |
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Executable
        run: |
          pyinstaller --onefile my_script.py 

      # -------------------------------------------------------------
      # END OF LANGUAGE SETUP
      # -------------------------------------------------------------

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Points to the compiled folder or file path generated in your build step
          files: |
            dist/*
            build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

